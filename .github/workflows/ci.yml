name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://example.invalid
          NEXT_PUBLIC_PM_TILES_URL: https://example.invalid/maps/valencia.pmtiles
          NEXT_PUBLIC_MAP_ASSETS_URL: https://example.invalid/maps

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: aparca
          POSTGRES_USER: aparca
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aparca -d aparca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aparca:test-password@localhost:5432/aparca
      RUN_POSTGIS_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.9.18"
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: services/api
        run: uv sync --dev
      - working-directory: services/api
        run: uv run ruff check .
      - working-directory: services/api
        run: uv run ruff format --check .
      - working-directory: services/api
        run: uv run alembic upgrade head
      - working-directory: services/api
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Verify generated OpenAPI types
        shell: bash
        run: |
          cd services/api
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null && break
            sleep 1
          done
          cd ../..
          pnpm --filter @aparca/web openapi:generate
          git diff --exit-code -- apps/web/src/lib/api.generated.ts
