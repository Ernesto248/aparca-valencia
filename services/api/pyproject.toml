[project]
name = "aparca-valencia-api"
version = "0.1.0"
description = "API geoespacial de Aparca València"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "fastapi==0.163.1",
  "geoalchemy2==0.21.0",
  "greenlet==3.3.2",
  "httpx==0.28.1",
  "orjson==3.11.7",
  "pydantic==2.14.3",
  "pydantic-settings==2.13.1",
  "python-json-logger==4.0.0",
  "sqlalchemy==2.1.8",
  "uvicorn[standard]==0.41.0",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/router.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL with PostGIS"]

[tool.ruff.format]
quote-style = "double"
